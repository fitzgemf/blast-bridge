name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,app]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m blastbridge.validation.reference
      - run: python -m blastbridge.validation.priors
