[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "blastbridge"
version = "0.1.0"
description = "AI-assisted occupational blast-exposure records and human review for training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]
app = [
    "streamlit>=1.66,<2",
    "anthropic>=1.15,<2",
    # Newer wheels are blocked by Windows Smart App Control on the development machine.
    "scikit-learn>=1.6.1,<1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blastbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import helpers from scripts/; make the repo root importable for bare `pytest` too.
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]
markers = ["slow: large deterministic assembly checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/blastbridge"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
